name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Build EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name ProductCards product_cards_test.py

      - name: Package release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/ProductCards.exe release/ProductCards.exe
          Copy-Item README.md release/README.md
          Compress-Archive -Path release/* -DestinationPath ProductCards-Windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProductCards-Windows
          path: ProductCards-Windows.zip
          if-no-files-found: error
